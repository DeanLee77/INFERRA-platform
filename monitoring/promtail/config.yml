server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-container-files
    static_configs:
      - targets:
          - localhost
        labels:
          app: inferra
          compose_project: inferra
          compose_service: container-file
          source: docker-json-file
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
            compose_project: 'attrs."com.docker.compose.project"'
            compose_service: 'attrs."com.docker.compose.service"'
      - regex:
          source: filename
          expression: /var/lib/docker/containers/(?P<container_id>[0-9a-f]{12,64})/.+\.log
      - labels:
          container_id:
          compose_project:
          compose_service:
          stream:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: output
