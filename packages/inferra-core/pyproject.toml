[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferra-core"
version = "0.1.1"
description = "Deterministic, infrastructure-independent kernel for INFERRA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["inferra_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
