name: INFERRA CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.18"
  PIP_AUDIT_VERSION: "2.10.0"

jobs:
  python-supply-chain:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install pinned audit tooling
        run: python -m pip install "uv==${UV_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"
      - name: Check Python lockfile freshness
        run: python -m uv lock --check
      - name: Export locked Python dependency graph
        run: python -m uv export --frozen --all-extras --format requirements.txt --no-emit-project --output-file .python-audit-requirements.txt > /dev/null
      - name: Audit locked Python dependency graph
        run: python -m pip_audit -r .python-audit-requirements.txt --strict --no-deps --disable-pip --progress-spinner off --timeout 30

  backend:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev,async,semantic,reasoning,observability]"
      - name: Run backend test suite
        run: pytest --cov=src --cov-fail-under=97
      - name: Enforce import boundaries
        run: lint-imports --config .importlinter

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build API and worker images
        run: docker compose build api worker

  load-gate:
    name: Dockerized k6 production gate
    runs-on: ubuntu-latest
    needs: [python-supply-chain, backend, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Start API stack
        run: docker compose up -d --build api worker
      - name: Wait for API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health | python -c "import json, sys; data = json.load(sys.stdin); sys.exit(0 if data.get('status') == 'ok' else 1)"; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs --no-color
          exit 1
      - name: Run k6 production profile
        run: |
          docker run --rm \
            --network inferra_default \
            -e BASE_URL=http://api:8000 \
            -e VUS=500 \
            -e DURATION=1m \
            -e METRICS_RATE=4 \
            -e LIVE_RATE=12 \
            -e USER_SLEEP_SECONDS=3 \
            -v "${{ github.workspace }}/tests/load:/scripts:ro" \
            grafana/k6:0.51.0@sha256:b2de44f593444feca8c66e7ee8cd230b272f614a7d7b2e784e7b76569c00fbf7 run /scripts/k6_production_gate.js
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans
