name: inferra

# Base Compose is a local developer stack. Service ports are loopback-bound and
# Redis/Postgres/Fuseki/Grafana defaults are intentionally dev-only. Use
# docker-compose.prod.yml with secrets/init-secrets.* before any shared-network
# or production rehearsal so missing generated secrets fail closed.

x-common-service: &common-service
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      labels: "com.docker.compose.project,com.docker.compose.service"

x-monitoring-service: &monitoring-service
  <<: *common-service
  read_only: true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64M,mode=1777

x-app-service: &app-service
  <<: *common-service
  read_only: true
  tmpfs:
    - /tmp:size=128M,mode=1777

# Feature-rich, loopback-only local profile. These are deployment overrides,
# not canonical library defaults. Every value remains operator-overridable and
# the same mapping is injected into API and worker processes.
x-feature-flag-profile: &feature-flag-profile
  INFERRA_USE_HYPERGRAPH: ${INFERRA_USE_HYPERGRAPH:-true}
  INFERRA_LEGACY_ITERATE: ${INFERRA_LEGACY_ITERATE:-true}
  INFERRA_LAYERED_MEMORY: ${INFERRA_LAYERED_MEMORY:-true}
  INFERRA_ML_OPTIMIZED_DFS: ${INFERRA_ML_OPTIMIZED_DFS:-false}
  INFERRA_ASYNC_SYNC_ENABLED: ${INFERRA_ASYNC_SYNC_ENABLED:-true}
  INFERRA_MODULAR_IMPORTS: ${INFERRA_MODULAR_IMPORTS:-false}
  INFERRA_HYBRID_ORCHESTRATOR: ${INFERRA_HYBRID_ORCHESTRATOR:-false}
  INFERRA_ASYNC_POST_REASONING: ${INFERRA_ASYNC_POST_REASONING:-true}
  INFERRA_GENERATE_POST_REASONING_TTL: ${INFERRA_GENERATE_POST_REASONING_TTL:-true}
  INFERRA_PROV_O_TRACE: ${INFERRA_PROV_O_TRACE:-true}
  INFERRA_ENRICHED_API: ${INFERRA_ENRICHED_API:-true}
  INFERRA_ONTOLOGY_ADVISORY_ENABLED: ${INFERRA_ONTOLOGY_ADVISORY_ENABLED:-false}
  INFERRA_ONTOLOGY_AUTO_ANSWER_ENABLED: ${INFERRA_ONTOLOGY_AUTO_ANSWER_ENABLED:-false}
  INFERRA_ONTOLOGY_AUTO_ANSWER_CONFIDENCE_THRESHOLD: ${INFERRA_ONTOLOGY_AUTO_ANSWER_CONFIDENCE_THRESHOLD:-0.85}
  INFERRA_ONTOLOGY_REASONING_ENABLED: ${INFERRA_ONTOLOGY_REASONING_ENABLED:-false}
  INFERRA_ONTOLOGY_REASONING_CONFIDENCE_THRESHOLD: ${INFERRA_ONTOLOGY_REASONING_CONFIDENCE_THRESHOLD:-0.85}
  INFERRA_ONTOLOGY_REASONING_MIN_HIERARCHY_DEPTH: ${INFERRA_ONTOLOGY_REASONING_MIN_HIERARCHY_DEPTH:-1}
  INFERRA_ONTOLOGY_REASONING_MAX_CLOSURE_DEPTH: ${INFERRA_ONTOLOGY_REASONING_MAX_CLOSURE_DEPTH:-10}
  INFERRA_ONTOLOGY_QUESTION_STRATEGY_ENABLED: ${INFERRA_ONTOLOGY_QUESTION_STRATEGY_ENABLED:-false}
  INFERRA_REDIS_SESSION_STORE: ${INFERRA_REDIS_SESSION_STORE:-true}
  INFERRA_LLM_ENHANCEMENTS: ${INFERRA_LLM_ENHANCEMENTS:-false}
  INFERRA_STRICT_PORT_CONTRACTS: ${INFERRA_STRICT_PORT_CONTRACTS:-true}
  INFERRA_OBSERVABILITY_ENABLED: ${INFERRA_OBSERVABILITY_ENABLED:-true}
  INFERRA_AUTH_ENABLED: ${INFERRA_AUTH_ENABLED:-true}
  INFERRA_ABDUCTION_ENABLED: ${INFERRA_ABDUCTION_ENABLED:-true}
  INFERRA_INDUCTION_PIPELINE: ${INFERRA_INDUCTION_PIPELINE:-true}
  INFERRA_REASONING_ROUTER: ${INFERRA_REASONING_ROUTER:-true}
  INFERRA_CONFIDENCE_THRESHOLDS: ${INFERRA_CONFIDENCE_THRESHOLDS:-true}

services:
  api:
    <<: *app-service
    image: inferra-api:local
    build:
      context: .
    environment:
      <<: *feature-flag-profile
      INFERRA_API_KEY: ${INFERRA_API_KEY:-}
      INFERRA_API_KEY_OWNER_ID: ${INFERRA_API_KEY_OWNER_ID:-api-key}
      INFERRA_API_KEY_SCOPES: ${INFERRA_API_KEY_SCOPES:-read,llm:read}
      INFERRA_JWT_SECRET: ${INFERRA_JWT_SECRET:-}
      INFERRA_CSRF_PROTECTION: ${INFERRA_CSRF_PROTECTION:-false}
      INFERRA_CSRF_TOKEN: ${INFERRA_CSRF_TOKEN:-}
      INFERRA_CORS_ALLOWED_ORIGINS: ${INFERRA_CORS_ALLOWED_ORIGINS:-}
      INFERRA_CORS_ALLOW_CREDENTIALS: ${INFERRA_CORS_ALLOW_CREDENTIALS:-false}
      INFERRA_ENV: ${INFERRA_ENV:-local}
      INFERRA_LOAD_DOTENV: "false"
      INFERRA_LOG_LEVEL: WARNING
      INFERRA_RATE_LIMIT_PER_MINUTE: "120000"
      INFERRA_METRICS_CACHE_TTL_SECONDS: "30.0"
      INFERRA_OTEL_SAMPLE_RATE: "0.01"
      INFERRA_LLM_PROVIDER: ${INFERRA_LLM_PROVIDER:-}
      INFERRA_LLM_MODEL: ${INFERRA_LLM_MODEL:-}
      INFERRA_LLM_BASE_URL: ${INFERRA_LLM_BASE_URL:-}
      INFERRA_LLM_API_KEY: ${INFERRA_LLM_API_KEY:-}
      INFERRA_LLM_API_KEY_FILE: ${INFERRA_LLM_API_KEY_FILE:-}
      MODALRESEARCH_API_KEY: ${MODALRESEARCH_API_KEY:-}
      MODALRESEARCH_API_KEY_FILE: ${MODALRESEARCH_API_KEY_FILE:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_KEY_FILE: ${NVIDIA_API_KEY_FILE:-}
      AEGIS_LLM_API_KEY_ENCRYPTION_KEY: ${AEGIS_LLM_API_KEY_ENCRYPTION_KEY:-}
      AEGIS_LLM_API_KEY_ENCRYPTION_KEY_FILE: ${AEGIS_LLM_API_KEY_ENCRYPTION_KEY_FILE:-}
      AEGIS_LLM_API_KEY_ENCRYPTION_PREVIOUS_KEYS: ${AEGIS_LLM_API_KEY_ENCRYPTION_PREVIOUS_KEYS:-}
      AEGIS_LLM_API_KEY_ENCRYPTION_PREVIOUS_KEYS_FILE: ${AEGIS_LLM_API_KEY_ENCRYPTION_PREVIOUS_KEYS_FILE:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_API_KEY_FILE: ${ZAI_API_KEY_FILE:-}
      ZAI_MODEL: ${ZAI_MODEL:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FUSEKI_URL: http://fuseki:3030/inferra
      FUSEKI_READ_USER: ${FUSEKI_READ_USER:-inferra_reader}
      FUSEKI_READ_PASSWORD: ${FUSEKI_READ_PASSWORD:-inferra_read}
      OTEL_SERVICE_NAME: inferra-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI:-postgresql://inferra:inferra@postgres:5432/inferra}
      AEGIS_SQLALCHEMY_DATABASE_URI: ${AEGIS_SQLALCHEMY_DATABASE_URI:-postgresql://inferra:inferra@postgres:5432/inferra_aegis}
      DOCUMENT_CONVERSION_MAX_PDF_PAGES: ${DOCUMENT_CONVERSION_MAX_PDF_PAGES:-100}
      DOCUMENT_CONVERSION_MAX_OUTPUT_CHARS: ${DOCUMENT_CONVERSION_MAX_OUTPUT_CHARS:-200000}
      DOCUMENT_CONVERSION_MAX_EXPANSION_RATIO: ${DOCUMENT_CONVERSION_MAX_EXPANSION_RATIO:-100.0}
      DOCUMENT_CONVERSION_TIMEOUT_SECONDS: ${DOCUMENT_CONVERSION_TIMEOUT_SECONDS:-20.0}
      DOCUMENT_LLM_MAX_PROMPT_CHARS: ${DOCUMENT_LLM_MAX_PROMPT_CHARS:-50000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      fuseki:
        condition: service_started
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/live', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app-service
    image: inferra-worker:local
    build:
      context: .
    command: celery -A src.tasks.celery_app.app worker --loglevel=INFO
    environment:
      <<: *feature-flag-profile
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FUSEKI_URL: http://fuseki:3030/inferra
      FUSEKI_USER: ${FUSEKI_USER:-admin}
      FUSEKI_PASSWORD: ${FUSEKI_PASSWORD:-admin}
      FUSEKI_READ_USER: ${FUSEKI_READ_USER:-inferra_reader}
      FUSEKI_READ_PASSWORD: ${FUSEKI_READ_PASSWORD:-inferra_read}
      INFERRA_ENV: ${INFERRA_ENV:-local}
      INFERRA_LOAD_DOTENV: "false"
      INFERRA_LLM_PROVIDER: ${INFERRA_LLM_PROVIDER:-}
      INFERRA_LLM_MODEL: ${INFERRA_LLM_MODEL:-}
      INFERRA_LLM_BASE_URL: ${INFERRA_LLM_BASE_URL:-}
      INFERRA_LLM_API_KEY: ${INFERRA_LLM_API_KEY:-}
      INFERRA_LLM_API_KEY_FILE: ${INFERRA_LLM_API_KEY_FILE:-}
      MODALRESEARCH_API_KEY: ${MODALRESEARCH_API_KEY:-}
      MODALRESEARCH_API_KEY_FILE: ${MODALRESEARCH_API_KEY_FILE:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_KEY_FILE: ${NVIDIA_API_KEY_FILE:-}
      AEGIS_LLM_API_KEY_ENCRYPTION_KEY: ${AEGIS_LLM_API_KEY_ENCRYPTION_KEY:-}
      AEGIS_LLM_API_KEY_ENCRYPTION_KEY_FILE: ${AEGIS_LLM_API_KEY_ENCRYPTION_KEY_FILE:-}
      AEGIS_LLM_API_KEY_ENCRYPTION_PREVIOUS_KEYS: ${AEGIS_LLM_API_KEY_ENCRYPTION_PREVIOUS_KEYS:-}
      AEGIS_LLM_API_KEY_ENCRYPTION_PREVIOUS_KEYS_FILE: ${AEGIS_LLM_API_KEY_ENCRYPTION_PREVIOUS_KEYS_FILE:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_API_KEY_FILE: ${ZAI_API_KEY_FILE:-}
      ZAI_MODEL: ${ZAI_MODEL:-}
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI:-postgresql://inferra:inferra@postgres:5432/inferra}
      AEGIS_SQLALCHEMY_DATABASE_URI: ${AEGIS_SQLALCHEMY_DATABASE_URI:-postgresql://inferra:inferra@postgres:5432/inferra_aegis}
    depends_on:
      redis:
        condition: service_healthy
      fuseki:
        condition: service_started
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from src.tasks.celery_app import app; import sys; response = app.control.inspect(timeout=2).ping() or {}; sys.exit(0 if response else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  otel-collector:
    <<: *monitoring-service
    image: otel/opentelemetry-collector:0.96.0@sha256:71ac13c2a9b875b953cf6b96af6f06897ba9be07f6f9c90b10d34865853e78d2
    user: "10001:10001"
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro

  prometheus:
    <<: *monitoring-service
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  loki:
    <<: *monitoring-service
    image: grafana/loki:2.9.8@sha256:8b5bd7748d0e4da66cd741ac276e485517514af0bea32167e27c0e1a95bcf8aa
    user: "10001:10001"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    <<: *monitoring-service
    image: grafana/promtail:2.9.8@sha256:45d54f0ebd7a19acbcd4693a3227d84d27d98abe1dc7ea3068d31d5d02dbe696
    user: "0:0"
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    <<: *monitoring-service
    image: grafana/grafana:11.2.2@sha256:d5133220d770aba5cb655147b619fa8770b90f41d8489a821d33b1cd34d16f89
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_METRICS_ENABLED: "true"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inferra}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - postgres

  redis:
    <<: *common-service
    image: redis:7@sha256:d3be87a1060455213a204d2b0a7f04d45d19a16a98e85b3c37b7c33b5f0c489e
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  fuseki:
    <<: *common-service
    image: stain/jena-fuseki:latest@sha256:b1d0c96f19adddef417520184471ac816cf36c6e72936a88ea02b29f4305929a
    entrypoint: ["/sbin/tini", "--", "sh", "/inferra-fuseki/entrypoint.sh"]
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_PASSWORD:-admin}
      FUSEKI_READ_USER: ${FUSEKI_READ_USER:-inferra_reader}
      FUSEKI_READ_PASSWORD: ${FUSEKI_READ_PASSWORD:-inferra_read}
      FUSEKI_DATASET_1: inferra
      TDB: "2"
    volumes:
      - fuseki-data:/fuseki
      - ./docker/fuseki:/inferra-fuseki:ro

  explorer:
    <<: *common-service
    profiles:
      - explorer
    build:
      context: ../graph-explorer
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./explorer-config/config.json:/graph-explorer/config.json:ro
    depends_on:
      fuseki:
        condition: service_started

  postgres:
    <<: *common-service
    image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inferra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inferra}
      POSTGRES_DB: inferra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inferra -d inferra"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  postgres-init:
    <<: *common-service
    image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inferra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inferra}
      POSTGRES_DB: inferra
      AEGIS_POSTGRES_DB: ${AEGIS_POSTGRES_DB:-inferra_aegis}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -n "$${POSTGRES_PASSWORD_FILE:-}" ]; then
          export PGPASSWORD="$$(cat "$${POSTGRES_PASSWORD_FILE}")"
        else
          export PGPASSWORD="$${POSTGRES_PASSWORD:-}"
        fi
        if psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc "SELECT 1 FROM pg_database WHERE datname = '$${AEGIS_POSTGRES_DB}'" | grep -q 1; then
          echo "AEGIS database $${AEGIS_POSTGRES_DB} already exists"
        else
          createdb -h postgres -U "$${POSTGRES_USER}" "$${AEGIS_POSTGRES_DB}"
          echo "Created AEGIS database $${AEGIS_POSTGRES_DB}"
        fi

volumes:
  fuseki-data:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
